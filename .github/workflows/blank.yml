name: Build Android APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Usando ZIP: $ZIPFILE"
          mkdir -p game
          unzip -q -o "$ZIPFILE" -d game
          PROJECT=$(dirname "$(find game -name project.godot | head -n 1)")
          echo "Proyecto en: $PROJECT"
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ "$HOME" != "/root" ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore $HOME/debug.keystore

      - name: Configure Godot editor for Android
        run: |
          godot --headless -v -e --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres | head -n 1)
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          echo 'export/android/force_system_user = false' >> "$SETTINGS"
          echo 'export/android/shutdown_adb_on_exit = true' >> "$SETTINGS"

      - name: Import project
        run: |
          cd "$PROJECT"
          godot --headless -v --import || true

      - name: Export APK
        run: |
          cd "$PROJECT"
          mkdir -v -p build
          godot --headless -v --export-debug "Android" build/stickman-physics-arena.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stickman-physics-arena-apk
          path: ${{ env.PROJECT }}/build/stickman-physics-arena.apk
